name: WIF claims (temporary)
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Show OIDC claims (token itself is not printed)
        run: |
          jwt=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -r .value)
          echo "::add-mask::$jwt"
          echo "$jwt" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{iss,aud,sub,repository,repository_owner,ref,event_name,workflow_ref,job_workflow_ref,environment}' || \
          echo "$jwt" | cut -d. -f2 | tr '_-' '/+' | awk '{l=length($0)%4; if(l) $0=$0 substr("===",1,4-l); print}' | base64 -d | jq '{iss,aud,sub,repository,repository_owner,ref,event_name,workflow_ref,job_workflow_ref,environment}'
