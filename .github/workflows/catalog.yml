name: Rebuild project catalog

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write   # lets the job get a GitHub OIDC token for Claude (Workload Identity Federation)

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: pip install --quiet --upgrade anthropic
      - name: Build catalog
        env:
          GH_TOKEN: ${{ secrets.CATALOG_TOKEN }}
          # Claude via Workload Identity Federation: no API key. These IDs are not secrets.
          # The script fetches a fresh GitHub OIDC token into the file before each Claude call.
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/gha-oidc-jwt
        run: python scripts/build_catalog.py
      - name: Commit if anything changed
        run: |
          git add data/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git -c user.name="catalog-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Rebuild catalog $(date -u +%F)"
          git push
