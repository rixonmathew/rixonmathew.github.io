name: Rebuild project catalog

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install --quiet anthropic
      - name: Build catalog
        env:
          GH_TOKEN: ${{ secrets.CATALOG_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/build_catalog.py
      - name: Commit if anything changed
        run: |
          git add data/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git -c user.name="catalog-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Rebuild catalog $(date -u +%F)"
          git push
