name: Verify Sonnet fallback (temporary)
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: pip install --quiet --upgrade anthropic
      - name: Fake a Haiku decline, then call Sonnet for real
        env:
          GH_TOKEN: ${{ secrets.CATALOG_TOKEN }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/gha-oidc-jwt
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, "scripts")
          import anthropic, build_catalog as bc
          real, calls = anthropic.Anthropic(), []
          class Refused:
              stop_reason, content = "refusal", []
          class Messages:
              def create(self, **kw):
                  calls.append(kw["model"])
                  if len(calls) == 1:
                      return Refused()  # pretend Haiku declined
                  r = real.messages.create(**kw)
                  print("real response model:", r.model, "stop_reason:", r.stop_reason)
                  return r
          class Client:
              messages = Messages()
          sha, text = bc.readme("ai-prism")
          out = bc.summarize(Client(), {"name": "ai-prism", "language": None}, text, [])
          print("models called:", calls)
          print("result:", out)
          assert calls == [bc.MODEL, bc.FALLBACK_MODEL], calls
          assert out and out["category"] in bc.CATEGORIES and out["summary"], out
          print("FALLBACK OK")
          PY
